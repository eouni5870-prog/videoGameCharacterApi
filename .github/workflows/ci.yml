name: CI

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore videoGameCharacterApi.slnx

      - name: Build
        run: dotnet build videoGameCharacterApi.slnx --no-restore --configuration Release

      - name: Test
        run: dotnet test videoGameCharacterApi.slnx --no-build --configuration Release --verbosity normal
